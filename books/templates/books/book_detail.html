<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 p-5 glass-panel shadow-lg">
            <h2 class="fw-bold text-dark">{{ book.title }}</h2>
            <p class="text-muted fs-5">By {{ book.author }}</p>
            <hr>
            <p><strong>Total Pages:</strong> {{ book.total_number_of_pages }}</p>
            <p><strong>Rental Fee:</strong> ${{ book.borrow_fee }}</p>
            <p><strong>Security Deposit:</strong> ${{ book.deposit_fee }}</p>
            <p><strong>Payment Address:</strong> {{ book.payment_number }}</p>
            
            <div class="mt-4 d-flex gap-2">
                <a href="{% url 'book_list' %}" class="btn btn-dark rounded-3 px-4">Back to Catalog</a>
                {% if book.available %}
                    <a href="{% url 'request_borrow' book.id %}" class="btn btn-primary rounded-3 px-4">Request to Borrow</a>
                {% else %}
                    <button class="btn btn-secondary rounded-3 px-4" disabled>Unavailable</button>
                {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
