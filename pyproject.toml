[project]
name = "librarysite"
version = "0.1.0"
dependencies = [
    "Django==6.0.5",
    "psycopg2-binary==2.9.12",
    "dj-database-url==3.1.2",
    "asgiref==3.11.1",
    "sqlparse==0.5.5",
    "tzdata==2026.2"
]

[tool.vercel]
entrypoint = "librarysite.wsgi:application"

[tool.vercel.scripts]
build = "python check_db.py && python manage.py migrate"